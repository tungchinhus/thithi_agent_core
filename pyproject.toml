[project]
name = "thithi-agentic-core"
version = "0.1.0"
description = "THITHI Agentic Core: Claude lập kế hoạch và QA trên cloud, AI local xử lý dữ liệu nội bộ"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.4,<3",
  "cryptography>=42",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thithi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI dùng Depends() làm giá trị mặc định
