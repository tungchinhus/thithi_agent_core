# Toàn bộ chạy trong mạng nội bộ. Chỉ service `gateway` được tường lửa cho phép gọi ra
# api.anthropic.com (HTTPS chiều ra). Không mở cổng nào từ internet vào.
services:
  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment:
      PRIVACY_URL: http://privacy-vault:8090
    ports: ["8080:8080"]
    volumes: ["../data/gateway:/app/data"]
    depends_on: [privacy-vault, redis]
    networks: [internal, egress]

  # Che/đổi và tái tạo thông tin. Chạy CÙNG MÁY với ai-local, chỉ trong mạng internal (không ra internet).
  # Là nơi duy nhất giữ ánh xạ giá trị giả <-> giá trị thật (SQLite mã hoá, tự xoá theo ttl_hours).
  privacy-vault:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["uvicorn", "thithi.privacy.api:app", "--host", "0.0.0.0", "--port", "8090"]
    # File env riêng: khoá kho ánh xạ không bao giờ nạp vào container gateway.
    env_file: ../vault.env
    volumes: ["../data/vault:/app/vault"]
    depends_on: [ai-local]
    networks: [internal]

  ai-local:
    image: vllm/vllm-openai:latest
    # Đổi --model sau khi chạy bộ thử 50 câu hỏi tiếng Việt và chọn mô hình.
    command: ["--model", "${LOCAL_LLM_HF_MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}", "--served-model-name", "local-model", "--max-model-len", "16384"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    networks: [internal]

  # Hàng đợi Worker và trạng thái yêu cầu (ánh xạ token nằm trong Privacy Vault, không ở đây).
  redis:
    image: redis:7-alpine
    networks: [internal]

networks:
  internal: { internal: true }
  egress: {}

volumes:
  hf-cache: {}
