# Cấu hình Privacy Vault (chạy trên máy AI local).
# mode: token     -> <KH_01>, <SDT_02>  (mặc định, an toàn nhất)
#       pseudonym -> đổi sang giá trị giả trông như thật cho các loại trong pseudonym_kinds;
#                    các loại còn lại (số tiền, CCCD, STK, MST) vẫn dùng token.
mode: token
pseudonym_kinds: [NGUOI, CTY, KH, NCC, DIA_CHI, EMAIL, SDT]
# Ánh xạ tự xoá sau thời gian này; sau đó không tái tạo được nữa.
ttl_hours: 24
# Bắt buộc NER bằng LLM local. Chỉ môi trường dev (THITHI_ENV=dev, THITHI_NER=off) được bỏ qua.
require_ner: true
# Danh bạ tên đã biết (khách hàng, nhà cung cấp, nhân viên) xuất từ ERP/CRM/Entra ID, CSV hai cột `name,kind`.
# Bổ sung cho NER (bắt tên mà LLM local bỏ sót), không thay NER. Chỉ để trên máy AI local; file thiếu thì bỏ qua.
known_names: [data/vault/danh_ba.csv]
# Cột dữ liệu có cấu trúc luôn che theo tên cột, thêm vào danh sách mặc định trong masking.py.
sensitive_keys: {}
#   ma_nhan_vien: NV
#   so_hop_dong: HD
